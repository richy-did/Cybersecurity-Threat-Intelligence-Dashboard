global
    log /dev/log local0

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 20s
    timeout server 12s

frontend dashboard
    bind :80
    # Replace with bind :443 ssl crt /etc/haproxy/certs/dashboard.pem for HTTPS.
    acl lookup path /api/lookup
    stick-table type ip size 50k expire 10m store http_req_rate(1m)
    http-request track-sc0 src if lookup
    http-request deny deny_status 429 if lookup { sc_http_req_rate(0) gt 12 }
    default_backend dashboard_nodes

backend dashboard_nodes
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web01 WEB01_PRIVATE_IP:3000 check inter 2s fall 2 rise 2
    server web02 WEB02_PRIVATE_IP:3000 check inter 2s fall 2 rise 2
